
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تجربة الواقع المعزز</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #090d16; color: white; font-family: Arial, sans-serif; }
    
    /* شاشة البداية (الزر الكبير) */
    #start-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #090d16;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #start-btn {
      background-color: #ff4545;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 20px 50px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 69, 69, 0.5);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    #start-btn:active { background-color: #cc0000; }

    model-viewer { width: 100vw; height: 100vh; }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <!-- شاشة البداية -->
  <div id="start-screen">
    <h1>تجربة الواقع المعزز</h1>
    <p>رائد الفضاء في غرفتك 🚀</p>
    <button id="start-btn" onclick="startExperience()">🚀 ابدأ التجربة</button>
  </div>

  <!-- عنصر الصوت -->
  <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- الموديل -->
  <model-viewer 
    id="model"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    alt="مجسم ثلاثي الأبعاد"
    ar 
    ar-modes="webxr scene-viewer quick-look"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    poster="">
    <button id="ar-button" slot="ar-button">🚀 شاهد في غرفتك</button>
  </model-viewer>

  <script>
    function startExperience() {
      // 1. نخبيو شاشة البداية
      document.getElementById('start-screen').style.display = 'none';

      // 2. نشغلو الموسيقى
      const music = document.getElementById('bg-music');
      music.play();

      // 3. نحاولو ندخلو للـ AR مباشرة (إذا مدعوم)
      const modelViewer = document.getElementById('model');
      if (modelViewer.canActivateAR) {
        modelViewer.activateAR(); // تفتح الكاميرا دغيا!
      }
    }
  </script>

</body>
</html>
