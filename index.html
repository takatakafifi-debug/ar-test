<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تجربة الواقع المعزز</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #090d16; color: white; font-family: Arial, sans-serif; }
    
    /* شاشة البداية بالزر الكبير */
    #start-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #090d16;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      text-align: center;
      padding: 20px;
    }
    #start-btn {
      background-color: #ff4545;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 20px 50px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 69, 69, 0.5);
      margin-top: 20px;
    }
    #start-btn:active { background-color: #cc0000; }

    /* زر الموسيقى */
    #music-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
      z-index: 100;
      display: none; /* مخبي في البداية */
    }

    model-viewer { width: 100vw; height: 100vh; }
  </style>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <!-- شاشة البداية -->
  <div id="start-screen">
    <h1>تجربة الواقع المعزز</h1>
    <p>شاهد المجسم في غرفتك 🚀</p>
    <button id="start-btn" onclick="startExperience()">🚀 ابدأ التجربة</button>
  </div>

  <!-- عنصر الصوت (تأكد إنو ملف music.mp3 مرفوع في GitHub) -->
  <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- زر الموسيقى -->
  <button id="music-btn" onclick="toggleMusic()">🎵</button>

  <!-- الموديل متاعك (model.glb) -->
  <model-viewer 
    id="model"
    src="model.glb" 
    alt="مجسم ثلاثي الأبعاد"
    ar 
    ar-modes="webxr scene-viewer quick-look"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    auto-rotate
    autoplay
    poster="">
    <!-- زر احتياطي للـ AR إذا ما خدمش الزر التلقائي -->
    <button id="ar-button" slot="ar-button" style="position:absolute; bottom:20px; right:20px; background:#ff4545; color:white; border:none; border-radius:25px; padding:12px 24px; font-size:16px; font-weight:bold;">🚀 شاهد في غرفتك</button>
  </model-viewer>

  <script>
    function startExperience() {
      // 1. نخبيو شاشة البداية
      document.getElementById('start-screen').style.display = 'none';
      // 2. نبيّن زر الموسيقى
      document.getElementById('music-btn').style.display = 'block';

      // 3. نشغلو الموسيقى
      const music = document.getElementById('bg-music');
      music.play().catch(e => console.log("الموسيقى محتاجة ضغطة من المستخدم"));

      // 4. نفتحوا الكاميرا دغيا (إذا التيليفون يدعم AR)
      const modelViewer = document.getElementById('model');
      if (modelViewer.canActivateAR) {
        modelViewer.activateAR(); 
      }
    }

    function toggleMusic() {
      const music = document.getElementById('bg-music');
      const btn = document.getElementById('music-btn');
      if (music.paused) {
        music.play();
        btn.innerHTML = '⏸️';
      } else {
        music.pause();
        btn.innerHTML = '🎵';
      }
    }
  </script>

</body>
</html>
